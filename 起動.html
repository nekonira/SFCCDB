<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>サカつく2026 データベース & チームビルダー</title>
  <style>
    body {
      background-color: #070a10;
      color: #f1f5f9;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background: rgba(15, 23, 42, 0.9);
      padding: 2.5rem;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.12);
      text-align: center;
      max-width: 480px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 1rem;
      color: #38bdf8;
    }
    p {
      color: #94a3b8;
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 1.5rem;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 0.85rem 1.25rem;
      margin-bottom: 0.75rem;
      background: #2563eb;
      color: #ffffff;
      font-weight: bold;
      text-decoration: none;
      border-radius: 8px;
      box-sizing: border-box;
      transition: background 0.2s;
    }
    .btn:hover {
      background: #1d4ed8;
    }
    .btn-secondary {
      background: #334155;
    }
    .btn-secondary:hover {
      background: #475569;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>サカつく2026 データベース</h1>
    <p>以下のいずれかのボタンをクリックしてアプリを起動してください：</p>
    <a href="index.html" class="btn">🚀 直接アプリを開く (おすすめ)</a>
    <a href="http://localhost:3000/" class="btn btn-secondary">🌐 ローカルWebサーバーで開く</a>
  </div>
</body>
</html>
